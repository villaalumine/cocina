function costoIng(i){

  r.onsuccess=()=>{const t=r.result.transaction('h',modo==='get'?'readonly':'readwrite').objectStore('h'),q=modo==='get'?t.get('dir'):modo==='del'?t.delete('dir'):t.put(val,'dir');q.onsuccess=()=>ok(q.result);q.onerror=()=>mal(q.error)}});
async function carpeta(){if(!puedeCarpeta())return null;try{return await idb('get')||null}catch(e){return null}}
async function escribirCarpeta(out,interactivo){
  const h=await carpeta();if(!h)return false;
  let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted'&&interactivo)p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return false;
  const f=await h.getFileHandle(BK_ARCH,{create:true}),w=await f.createWritable();await w.write(JSON.stringify(out,null,1));await w.close();
  try{localStorage.setItem('cocina.carpetaT',Date.now());localStorage.setItem('cocina.backup',Date.now())}catch(e){}return true;
}
async function elegirCarpeta(b){

// Copia automática: cada 10 días, guardada en Firestore (solo dueño), pisa la anterior
const BK_DIAS=10,BK_TROZO=600000;
async function autoCopia(forzar){
  if(!S.owner)return;
  const metaRef=doc(db,'respaldo','meta');let meta=null;
  try{const m=await getDoc(metaRef);meta=m.exists()?m.data():null}catch(e){console.warn('respaldo',e);return}
  S.bkMeta=meta;if(S.view==='copia')render(true);
  if(!forzar&&meta&&Date.now()-meta.t<BK_DIAS*864e5)return;
  const out=await armarCopia(),txt=JSON.stringify(out),n=Math.ceil(txt.length/BK_TROZO)||1;
  for(let i=0;i<n;i++)await setDoc(doc(db,'respaldo','p'+i),{i,txt:txt.slice(i*BK_TROZO,(i+1)*BK_TROZO)});
  for(let i=n;i<(meta?.partes||0);i++){try{await deleteDoc(doc(db,'respaldo','p'+i))}catch(e){}}
  S.bkMeta={t:Date.now(),partes:n,cant:bkCant(out),kb:Math.round(txt.length/1024)};
  await setDoc(metaRef,S.bkMeta);
  if(S.view==='copia')render(true);
}
async function leerCopiaAuto(){
  const m=(await getDoc(doc(db,'respaldo','meta'))).data();if(!m)throw new Error('Todavía no hay copia automática.');
  let txt='';for(let i=0;i<m.partes;i++)txt+=(await getDoc(doc(db,'respaldo','p'+i))).data().txt;
  return JSON.parse(txt);
}
async function restaurarCopia(out,prog){
  const d=out.datos;let n=0;
  if(d.catalogo&&!d.catalogo.error){prog('catálogo');await setDoc(doc(db,'cfg','catalogo'),d.catalogo);n++}
  for(const [k,c] of BK_COLS){const arr=d[k];if(!Array.isArray(arr))continue;prog(k.replace('_',' '));
    for(const x of arr){const {_id,...data}=x;try{await setDoc(doc(db,...c,_id),data);n++}catch(e){console.warn(k,_id,e)}}}
  return n;
}
async function backup(b){
  const out=await armarCopia(k=>b.textContent=`Bajando ${k.replace('_',' ')}…`);
  const cant=bkCant(out);
  try{if(await escribirCarpeta(out,true)){b.textContent='Descargar copia de seguridad';toast(`Copia guardada en "${S.carpetaNom||'tu carpeta'}": ${cant} registros.`);render(true);return out}}catch(e){console.warn(e)}
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'}),nom=`cocina-copia-${dayKey(Date.now())}.json`,file=new File([blob],nom,{type:'application/json'});
  try{localStorage.setItem('cocina.backup',Date.now())}catch(e){}
  if(esCelu()&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:nom})}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
  b.textContent='Descargar copia de seguridad';toast(`Copia lista: ${cant} registros.`);render(true);return out;
}
async function bkAuto(a,b){
  const txt0=b.textContent;
  try{
    if(a==='bkAhora'){b.textContent='Guardando copia…';await autoCopia(true);toast('Copia automática actualizada.');render(true);return}
    b.textContent='Leyendo copia…';const out=await leerCopiaAuto();
    if(a==='bkBajar'){await bajarCopia(out);b.textContent=txt0;return}
    if(a==='bkRestaurar'){
      if(!confirm(`¿Restaurar la copia del ${new Date(out.fecha).toLocaleString('es-AR')}?\n\nTodo lo que estaba en esa copia vuelve a como estaba ese día. Lo que se cargó después y no estaba en la copia no se borra.`)){b.textContent=txt0;return}

}

async function agregarItems(id){

    ...(a.extra.n.trim()&&num(a.extra.q)>0?[{pid:null,nombre:a.extra.n.trim(),unidad:a.extra.u||'u',cant:num(a.extra.q)}]:[])];

    <a class="btn wa" style="width:100%" href="${esc('https://wa.me/'+t+'?text='+encodeURIComponent(msg))}" target="_blank" rel="noopener" data-act="closeSheet">Mandar por WhatsApp</a>

async function comprimir(file){
  const img=await createImageBitmap(file);let w=img.width,h=img.height;const m=1100/Math.max(w,h);if(m<1){w=Math.round(w*m);h=Math.round(h*m)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.6,u=c.toDataURL('image/jpeg',q);while(u.length>220000&&q>.25){q-=.08;u=c.toDataURL('image/jpeg',q)}return u;
}

async function darAlta(f){
  const fd=new FormData(f),usuario=userSlug(fd.get('usuario')),clave=String(fd.get('clave'));
  if(!usuario){S.note='El usuario tiene que tener letras o números.';render(true);return}
  if(Object.values(S.equipo).some(x=>usuarioDe(x)===usuario)){S.note=`Ya existe el usuario "${usuario}". Elegí otro.`;render(true);return}
  const m={nombre:String(fd.get('nombre')).trim(),usuario,email:usuario+DOM_U,rol:fd.get('rol'),local:TODOS_ROLES.includes(fd.get('rol'))?'todos':fd.get('local'),activo:true,alta:Date.now()};
  let cred;
  try{cred=await createUserWithEmailAndPassword(auth2,m.email,clave)}catch(e){S.note=e?.code==='auth/email-already-in-use'?`Ya existe el usuario "${usuario}". Elegí otro.`:errMsg(e);render(true);return}
  await signOut(auth2).catch(()=>{});
  await w(async()=>{await setDoc(doc(db,'equipo',cred.user.uid),m);await setDoc(doc(db,'claves',cred.user.uid),{clave,t:Date.now()})},`${m.nombre} ya puede entrar. Usuario: ${usuario} · Contraseña: ${clave}`);
}

function menQuery(t){const m=t.value.slice(0,t.selectionStart).match(/(^|\s)@([^\s@]*)$/);return m?m[2]:null}

  const box=$('#mentions');if(!box)return;const q=menQuery(t);
  if(q===null){box.hidden=true;return}
  const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const L=chatGente(workLocal()).filter(p=>p.id!==S.uid&&norm(p.nombre).includes(norm(q)));
  if(!L.length){box.hidden=true;return}

}

  if(ds.usrchk!==undefined){const u=userSlug(t.value),m=$('#usrmsg'),ya=u&&Object.values(S.equipo).some(x=>usuarioDe(x)===u);if(m){m.textContent=!u?'':ya?`❌ El usuario "${u}" ya existe. Elegí otro.`:`✅ "${u}" está libre.`;m.style.color=ya?'var(--redink)':'var(--ok)'}return}
  if(ds.aq!==undefined||ds.axn!==undefined||ds.axq!==undefined){const a=S.agr[S.addOpen];if(a){if(ds.aq!==undefined)a.qty[ds.aq]=t.value;if(ds.axn!==undefined)a.extra.n=t.value;if(ds.axq!==undefined)a.extra.q=t.value}return}
  if(ds.filtro!==undefined){const q=t.value.trim().toLowerCase();document.querySelectorAll('#main tr[data-n]').forEach(r=>r.hidden=!!r.dataset.off||(!!q&&!r.dataset.n.includes(q)));document.querySelectorAll('#main .grp').forEach(g=>g.hidden=!!q&&!g.querySelector('tr[data-n]:not([hidden])'));return}
  if(ds.buscar!==undefined){S.pedir.buscar=t.value;const q=t.value.trim().toLowerCase();document.querySelectorAll('#main .pitem').forEach(el=>{const inp=el.querySelector('input');el.hidden=!!q&&!el.dataset.n.includes(q)&&!(num(inp.value)>0)});document.querySelectorAll('#main h4.rubro').forEach(h=>h.hidden=!!q)}
  else if(ds.q!==undefined){S.pedir.qty[ds.q]=t.value;const c=$('#pcount');if(c)c.textContent=countPedido()}
  else if(ds.pnota!==undefined)S.pedir.nota=t.value;
  else if(ds.xn!==undefined)S.pedir.extra[+ds.xn].n=t.value;
  else if(ds.xq!==undefined)S.pedir.extra[+ds.xq].q=t.value;
  else if(ds.xu!==undefined)S.pedir.extra[+ds.xu].u=t.value;
  else if(ds.c!==undefined)S.conteo[ds.c]=t.value;
  else if(ds.pv!==undefined)S.catDraft.proveedores[+ds.pv][ds.f]=t.value;
  else if(ds.pr!==undefined){const p=S.catDraft.productos[+ds.pr];if(ds.min){p.min={...(p.min||{}),[ds.min]:num(t.value)}}else if(ds.f==='precio'){if(t.value.trim())p.precio=num(t.value);else delete p.precio}else p[ds.f]=t.value}
  else{const f=t.closest('form[data-form=rec]');if(!f)return;const id=f.dataset.id,p=S.pedidos.find(x=>x.id===id);if(!p)return;const d=recDraft(p);
    const k=ds.rec??ds.rrem;if(ds.rec!==undefined)d.items[+ds.rec].rec=t.value;if(ds.rrem!==undefined)d.items[+ds.rrem].rem=t.value;
    if(k!==undefined){const s=$(`#st-${id}-${k}`),i=p.items[+k],x=d.items[+k];if(s){s.textContent=stLabel2(i,x);s.className='st '+(stOk(i,x)?'ok':'bad')}}
    if(ds.cal!==undefined)d.items[+ds.cal].cal=t.value;if(ds.rnota!==undefined)d.items[+ds.rnota].nota=t.value;

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-recfoto]')&&t.files?.[0]&&S.recDraft){fotoReceta(t.files[0]);t.value='';return}
  if(t.matches('[data-ri]')&&S.recDraft){S.recDraft.ing[+t.dataset.ri][t.dataset.rk]=t.value;recRowCosto(+t.dataset.ri);return}
  if(t.matches('select[data-au]')){const a=S.agr[S.addOpen];if(a)a.unit[t.dataset.au]=t.value}
  if(t.matches('select[data-axu]')){const a=S.agr[S.addOpen];if(a)a.extra.u=t.value}
  if(t.matches('select[data-fprov]')){S.fProv=t.value;t.blur();render(true)}
  if(t.matches('select[data-festado]')){S.fEstado=t.value;t.blur();render(true)}
  if(t.matches('input[data-fdia]')){S.fDia=t.value;S.pVer=true;S.pOpen=null;t.blur();render(true)}
  if(t.matches('input[data-mfoto]')&&t.files?.[0]){subirFoto(t.dataset.mfoto,t.files[0]);t.value='';return}
  if(t.matches('input[data-perfilfoto]')&&t.files?.[0]){fotoPerfil(t.files[0]);t.value='';return}
  if(t.matches('input[data-foto]')&&t.files?.[0]){subirFoto(t.dataset.foto,t.files[0]);t.value=''}
  if(t.matches('input[data-dia]')){S.panelDia=t.value&&t.value<dayKey(Date.now())?t.value:null;t.blur();render(true)}
  if(t.matches('select[data-u]')){S.pedir.unit={...(S.pedir.unit||{}),[t.dataset.u]:t.value};const c=$('#pcount');if(c)c.textContent=countPedido()}
  if(t.matches('select[data-pv][data-f="canal"]')){S.catDraft.proveedores[+t.dataset.pv].canal=t.value;render(true);return}
  if(t.matches('select[data-cal],select[data-pr],select[data-rf],select[data-xu]'))t.dispatchEvent(new Event('input',{bubbles:true}));
  if(t.matches('select[data-eq]'))w(()=>updateDoc(doc(db,'equipo',t.dataset.eq),{[t.dataset.f]:t.value,...(t.dataset.f==='rol'&&TODOS_ROLES.includes(t.value)?{local:'todos'}:{})})).catch(()=>{});
});
document.addEventListener('keydown',e=>{if(!e.target.matches('textarea[data-chatin]'))return;const box=$('#mentions');
  if(box&&!box.hidden&&(e.key==='Enter'||e.key==='Tab')){const b=box.querySelector('button.on');if(b){e.preventDefault();mencionar(b.dataset.n);return}}
  if(box&&!box.hidden&&e.key==='Escape'){box.hidden=true;return}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();const fd=new FormData(f);
  if(f.dataset.form==='chat'){enviarChat(f);return}
  if(f.dataset.form==='mant'){cargarMant(f);return}
  if(f.dataset.form==='perfilClave'){const c=String(fd.get('clave'));try{await updatePassword(auth.currentUser,c);await setDoc(doc(db,'claves',S.uid),{clave:c,t:Date.now()}).catch(()=>{});$('#sheet').innerHTML='';toast('Contraseña cambiada.')}catch(er){S.note=er?.code==='auth/requires-recent-login'?'Por seguridad, salí y volvé a entrar, y ahí cambiá la contraseña.':errMsg(er);$('#sheet').innerHTML='';render(true)}return}
  if(f.dataset.form==='perfilNombre'){const n=f.nombre.value.trim().slice(0,40);if(!n)return;updateDoc(doc(db,'equipo',S.uid),{nombre:n}).then(()=>{S.equipo[S.uid]={...S.equipo[S.uid],nombre:n};$('#sheet').innerHTML='';toast('Nombre actualizado');render(true)}).catch(err=>{S.note=errMsg(err);render(true)});return}
  if(f.dataset.form==='rec'){guardarRec(f.dataset.id).catch(()=>{});return}
  if(f.dataset.form==='alta'){await darAlta(f);return}
  if(f.dataset.form==='cmb'){w(()=>updateDoc(doc(db,'cfg','catalogo'),{avisos:{...(S.cat?.avisos||{}),cmb:String(fd.get('cmb')).trim()}}),'Guardado. Tocá Probar para ver si te llega.').catch(()=>{});return}
  if(f.dataset.form==='avisos'){let tel=String(fd.get('tel')).replace(/\D/g,'');if(tel&&!tel.startsWith('54'))tel='549'+tel;w(()=>updateDoc(doc(db,'cfg','catalogo'),{avisos:{...(S.cat?.avisos||{}),tel,modo:fd.get('modo')}}),'Avisos guardados').catch(()=>{});return}
  if(f.dataset.form==='login'){try{await signInWithEmailAndPassword(auth,loginMail(fd.get('email')),String(fd.get('clave')))}catch(er){S.note=errMsg(er);render(true)}return}
  if(f.dataset.form==='signup'){S.claimName=String(fd.get('nombre')).trim();try{await createUserWithEmailAndPassword(auth,String(fd.get('email')).trim(),String(fd.get('clave')))}catch(er){S.note=errMsg(er);render(true)}return}
});

/* ---------- arranque ---------- */
async function claim(u){
  await setDoc(doc(db,'cfg','owner'),{uid:u.uid,t:Date.now()});
  await setDoc(doc(db,'equipo',u.uid),{nombre:S.claimName||'Dueño',email:u.email,rol:'Dueño',local:'todos',activo:true,alta:Date.now()});
  const c=await getDoc(doc(db,'cfg','catalogo'));if(!c.exists())await setDoc(doc(db,'cfg','catalogo'),SEED);
}
function subscribe(){
  let timer=setTimeout(()=>{S.note='Está tardando en cargar. Revisá la conexión.';render(true)},10000);
  const done=()=>{if(timer){clearTimeout(timer);timer=null;if(S.note.startsWith('Está tardando'))S.note=''}};
  const err=e=>{done();console.error(e);if(e.code==='permission-denied'){S.stage='blocked'}else{S.note='Se cortó la conexión con los datos. Recargá la página.'}render(true)};
  S.subs.push(onSnapshot(doc(db,'cfg','catalogo'),s=>{S.cat=s.exists()?s.data():{...SEED,proveedores:[],productos:[]};if(S.catDraft&&S.view!=='catalogo')S.catDraft=null;done();render()},err));
  S.subs.push(onSnapshot(query(collection(db,'pedidos'),orderBy('creado','desc'),limit(300)),s=>{S.pedidos=s.docs.map(d=>({id:d.id,...d.data()}));render()},err));
  S.subs.push(onSnapshot(query(collection(db,'solicitudes'),orderBy('creado','desc'),limit(300)),s=>{S.sols=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn('sols',e)));
  if(S.owner)S.subs.push(onSnapshot(collection(db,'claves'),s=>{S.claves={};s.docs.forEach(d=>S.claves[d.id]=d.data().clave);render()},e=>console.warn('claves',e)));
  S.subs.push(onSnapshot(collection(db,'stock'),s=>{S.stock={};s.docs.forEach(d=>S.stock[d.id]=d.data());render()},err));
  S.subs.push(onSnapshot(collection(db,'equipo'),s=>{S.equipo={};s.docs.forEach(d=>S.equipo[d.id]=d.data());
    const m=S.equipo[S.uid];if(!S.owner&&(!m||!m.activo)){S.stage='blocked'}render()},err));
}

const APP_V='2026-11-27f';
async function chequearVersion(){
  try{const t=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());const m=t.match(/const APP_V='([^']+)'/);
    if(m&&m[1]!==APP_V&&!document.querySelector('#nuevaV')){const d=document.createElement('button');d.id='nuevaV';d.dataset.act='recargar';d.innerHTML='✨ Hay una versión nueva de la app · <b>Actualizar</b>';document.body.appendChild(d)}}catch(e){}
}

onAuthStateChanged(auth,async u=>{
  S.subs.forEach(f=>f());S.subs=[];Object.keys(chatSubs).forEach(k=>{chatSubs[k]();delete chatSubs[k]});S.chat={};S.sols=[];S.cat=null;S.equipo={};S.pedidos=[];S.stock={};S.note='';
  S.uid=u?.uid||null;
  if(!u){S.stage='login';render(true);return}
  S.stage='loading';render(true);
  try{
    let o=await getDoc(doc(db,'cfg','owner'));
    if(!o.exists()){
      if(S.authMode!=='dueño'){S.stage='blocked';render(true);return}
      await claim(u);o=await getDoc(doc(db,'cfg','owner'));
    }
    S.owner=o.data().uid===u.uid;S.ownerUid=o.data().uid;
    if(!S.owner){const m=await getDoc(doc(db,'equipo',u.uid));if(!m.exists()||!m.data().activo){S.stage='blocked';render(true);return}}
    S.stage='app';if(!DESDE_AVISO||!location.hash||location.hash==='#')history.replaceState(null,'',S.local?'#panel':'#inicio');subscribe();render(true);setTimeout(limpiarFotosViejas,8000);if(S.owner)carpeta().then(h=>{if(h)S.carpetaNom=h.name});if(S.owner)setTimeout(()=>{autoCopia().catch(e=>console.warn('autoCopia',e));copiaCarpetaAuto().catch(e=>console.warn('carpeta',e))},15000);
  }catch(e){console.error(e);if(e.code==='permission-denied'){S.stage='blocked'}else{S.stage='error';S.note=errMsg(e)+(e.code?` (${e.code})`:'')}render(true)}
});
