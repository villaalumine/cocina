<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const CFG={apiKey:"AIzaSyAZnrlg52IRYs8FJ3SGIu9hBekbiwdkQ2Y",authDomain:"cocina-villa-alumine.firebaseapp.com",projectId:"cocina-villa-alumine",storageBucket:"cocina-villa-alumine.firebasestorage.app",messagingSenderId:"198736704033",appId:"1:198736704033:web:091d9e26862d441779e960"};
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const auth2=getAuth(initializeApp(CFG,'altas'));

const SEED={locales:[{id:'villa',nombre:'Villa Aluminé'},{id:'mara',nombre:'Mara'}],
proveedores:[{id:'vverd',nombre:'Verdulería',tel:''},{id:'vcarn',nombre:'Carnicería',tel:''},{id:'vlact',nombre:'Lácteos y fiambres',tel:''},{id:'valm',nombre:'Almacén mayorista',tel:''},{id:'vpan',nombre:'Panadería',tel:''}],
productos:[['p1','Tomate redondo','kg','vverd',8,5],['p2','Cebolla','kg','vverd',10,6],['p3','Lechuga','u','vverd',12,6],['p4','Limón','kg','vverd',3,6],['p5','Papa','kg','vverd',15,10],['p6','Palta','u','vverd',10,6],['p7','Vacío','kg','vcarn',6,8],['p8','Pechuga de pollo','kg','vcarn',8,5],['p9','Carne picada','kg','vcarn',5,5],['p10','Leche entera','l','vlact',20,4],['p11','Crema de leche','l','vlact',4,3],['p12','Manteca','kg','vlact',3,2],['p13','Queso tybo','kg','vlact',4,3],['p14','Jamón cocido','kg','vlact',3,2],['p15','Harina 000','kg','valm',10,5],['p16','Azúcar','kg','valm',5,2],['p17','Aceite de girasol','l','valm',10,10],['p18','Huevos','maple','valm',6,2],['p19','Pan de molde','u','vpan',6,2],['p20','Medialunas','doc','vpan',10,0]].map(([id,nombre,unidad,prov,v,m])=>({id,nombre,unidad,prov,min:{villa:v,mara:m}}))};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=p=>p+Math.random().toString(36).slice(2,9);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('es-AR');
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const fecha=t=>new Date(t).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'numeric'});
const hora=t=>new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const ESTADOS={pendiente:'Sin enviar',enviado:'Esperando',recibido:'Recibido',diferencias:'Recibido'};
const SOPORTE='5492236918566';
const sopLink=()=>'https://wa.me/'+SOPORTE+'?text='+encodeURIComponent(`Hola Matías, soy ${me()?.nombre||''}. Tengo una consulta sobre la app de cocina: `);
const UNIDADES=['kg','u','bolsa','cajón','bulto'];
const ROLES=['Encargado/a','Jefe/a de cocina','Jefe/a de pedidos','Cocinero/a','Bartender'];
const NIVEL={'Encargado/a':2,'Jefe/a de cocina':3,'Jefe/a de pedidos':3,'Jefe/a de barra':3};
const lvl=()=>S.owner?1:(NIVEL[me()?.rol]||4);
const myLocs=()=>S.owner||!me()?.local||me().local==='todos'?locales().map(l=>l.id):[me().local];
const S={chat:{},agr:{},addOpen:null,fotos:{},fProv:'',fDia:'',stage:'boot',authMode:'login',cat:null,pedidos:[],stock:{},equipo:{},uid:null,owner:false,local:'todos',view:'',subs:[],
  pedir:{prov:null,qty:{},extra:[],nota:''},recOpen:null,rec:{},conteo:{},catDraft:null,pending:false,note:'',claimName:''};
try{S.local=localStorage.getItem('cocina.sec')||''}catch(e){}

const locales=()=>S.cat?.locales?.length?S.cat.locales:SEED.locales;
const locName=id=>locales().find(l=>l.id===id)?.nombre||id;
const provs=()=>S.cat?.proveedores||[];const prods=()=>S.cat?.productos||[];
const prov=id=>provs().find(p=>p.id===id);const provsFor=loc=>provs().filter(p=>!p.local||p.local==='ambos'||p.local===loc);const prod=id=>prods().find(p=>p.id===id);
const me=()=>S.equipo[S.uid]||null;
const nameOf=uid=>S.equipo[uid]?.nombre||'Alguien';
const canAdmin=()=>lvl()<=2;
const workLocal=()=>S.local||locales()[0].id;
const stockOf=(loc,pid)=>num(S.stock[loc]?.items?.[pid]);
const minOf=(p,loc)=>num(p.min?.[loc]);
const lowList=loc=>prods().filter(p=>minOf(p,loc)>0&&stockOf(loc,p.id)<minOf(p,loc));
const inLocal=p=>p.local===workLocal();

function msgText(p){
  const L=[`*Pedido ${locName(p.local)}* · ${fecha(p.creado)}`,'Hola! Te paso el pedido:',...p.items.map(i=>`• ${fmt(i.cant)} ${i.unidad} ${i.nombre}`)];
  if(p.nota)L.push('','Nota: '+p.nota);
  L.push('','Gracias! '+nameOf(p.por));return L.join('\n');
}
function waLink(p){const t=String(prov(p.prov)?.tel||'').replace(/\D/g,'');return 'https://wa.me/'+t+'?text='+encodeURIComponent(msgText(p))}

/* ---------- pantallas de acceso ---------- */
function vAcceso(){
  if(S.stage==='boot'||S.stage==='loading')return '<p class="empty">Cargando la cocina…</p>';
  if(S.stage==='blocked')return `<div class="login"><h2>Tu cuenta no está habilitada</h2><p class="sub">Pedile al dueño que te dé de alta en la pestaña Equipo, con este mail: <b>${esc(auth.currentUser?.email)}</b>.</p><button data-act="salir" style="margin-top:16px">Salir</button></div>`;
  if(S.stage==='error')return `<div class="login"><h2>No pudimos conectar</h2><p class="sub">${esc(S.note)}</p><button data-act="reintentar" class="pri" style="margin-top:16px">Probar de nuevo</button></div>`;
  const signup=S.authMode==='dueño';
  return `<div class="login"><h2>${signup?'Crear la cuenta del dueño':'Entrar a la cocina'}</h2>
  <p class="sub">${signup?'Esto se hace una sola vez. El que crea esta cuenta queda como dueño y es el que da de alta al equipo.':'Usá el mail y la clave que te dio el dueño.'}</p>
  ${S.note?`<p class="note" style="margin-top:14px">${esc(S.note)}</p>`:''}
  <form data-form="${signup?'signup':'login'}" class="panel" style="margin-top:16px">
  ${signup?'<label for="l-n">Tu nombre</label><input id="l-n" name="nombre" required autocomplete="name">':''}
  <label for="l-e" ${signup?'style="margin-top:12px"':''}>Mail</label><input id="l-e" name="email" type="email" required autocomplete="email">
  <label for="l-p" style="margin-top:12px">Clave</label><input id="l-p" name="clave" type="password" required minlength="6" autocomplete="${signup?'new-password':'current-password'}">
  <button class="pri" style="width:100%;margin-top:16px" type="submit">${signup?'Crear cuenta de dueño':'Entrar'}</button></form>
  <div class="row" style="justify-content:space-between">${signup?'<button data-act="modo" data-id="login">Ya tengo cuenta</button>':'<button data-act="olvide">Me olvidé la clave</button><button data-act="modo" data-id="dueño">Primera vez (dueño)</button>'}</div></div>`;
}

/* ---------- vistas ---------- */
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shiftDay=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dayKey(new Date(y,m-1,d+n))};
function prowHTML(p,extra){const r=p.recepcion;return `<button class="prow" data-act="abrir" data-id="${p.id}"><span class="pfecha"><b>${new Date(p.creado).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}</b><small>${hora(p.creado)}</small></span>
  <span class="pinfo"><b>${esc(prov(p.prov)?.nombre||'Proveedor')}</b><small>${extra||`${p.items.length} producto${p.items.length>1?'s':''} · ${esc(nameOf(p.por))}${r&&num(r.monto)?' · '+money(num(r.monto)):''}${p.fotos?' · 📷':''}`}</small></span>
  ${badgeHTML(p)}</button>`}
const badgeHTML=(p,big)=>`<span class="bwrap"${big?' style="font-size:15px"':''}><span class="badge b-${p.estado}">${ESTADOS[p.estado]||p.estado}</span>${p.estado==='diferencias'?'<span class="badge b-dif">Con diferencias</span>':''}</span>`;
const faltantes=p=>p.recepcion?p.items.map((i,k)=>({i,x:p.recepcion.items?.[k]})).filter(o=>o.x&&o.x.rec<num(o.i.cant)):[];
function vPanel(){
  const hoy=dayKey(Date.now()),dia=S.panelDia||hoy,esHoy=dia===hoy;
  const ps=S.pedidos.filter(inLocal);
  const enviados=ps.filter(p=>p.enviado&&dayKey(p.enviado)===dia);
  const pend=ps.filter(p=>p.estado==='enviado'||p.estado==='pendiente');
  const corte=Date.now()-30*864e5,falt=ps.filter(p=>p.recepcion&&p.recepcion.t>corte&&faltantes(p).length);
  const [y,m,d]=dia.split('-').map(Number),diaTxt=esHoy?'Hoy':new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const rol=S.owner?'Administrador':(me()?.rol||'');
  const sel=S.panelSel;
  const cards=[['env',enviados.length,`Pedidos enviados ${esHoy?'hoy':'ese día'}`,''],['pend',pend.length,'Pendientes de entrega','y'],['falt',falt.length,'Faltantes por recibir','r']];
  let lista='';
  if(sel==='env')lista=`<h3 class="ptit">Enviados ${esHoy?'hoy':'el '+esc(diaTxt)}</h3>${enviados.length?`<div class="plist">${enviados.map(p=>prowHTML(p)).join('')}</div>`:'<p class="empty">No se envió ningún pedido ese día.</p>'}`;
  if(sel==='pend')lista=`<h3 class="ptit">Pendientes de entrega</h3><p class="meta">Pedidos que todavía no se recibieron, de cualquier fecha.</p>${pend.length?`<div class="plist">${pend.map(p=>prowHTML(p,p.estado==='pendiente'?'Todavía no se mandó por WhatsApp':`Enviado ${fecha(p.enviado||p.creado)} ${hora(p.enviado||p.creado)} · ${p.items.length} producto${p.items.length>1?'s':''}`)).join('')}</div>`:'<p class="empty">No hay pedidos pendientes.</p>'}`;
  if(sel==='falt')lista=`<h3 class="ptit">Faltantes por recibir</h3><p class="meta">Pedidos de los últimos 30 días que llegaron incompletos. Entrá para reclamarle al proveedor.</p>${falt.length?`<div class="plist">${falt.map(p=>prowHTML(p,'Faltó: '+faltantes(p).map(o=>`${fmt(num(o.i.cant)-o.x.rec)} ${esc(o.i.unidad)} ${esc(o.i.nombre)}`).join(', '))).join('')}</div>`:'<p class="empty">No hay faltantes. 🎉</p>'}`;
  return `<div class="head" style="margin-bottom:6px"><div><h2>Hola, ${esc(me()?.nombre||'Matías')}</h2><p class="sub">${esc(rol)} · ${esc(locName(workLocal()))}</p></div></div>
  <div class="row diasel" style="margin:10px 0 18px"><button data-act="dia" data-id="-1" aria-label="Día anterior">‹</button><input type="date" data-dia value="${dia}" max="${hoy}" aria-label="Día"><button data-act="dia" data-id="1" aria-label="Día siguiente" ${esHoy?'disabled':''}>›</button>${esHoy?'':'<button data-act="dia" data-id="0">Hoy</button>'}</div>
  <div class="kpis k3">${cards.map(([k,n,t,c])=>`<button class="kpi ${c} ${n&&c==='r'?'':''} ${sel===k?'sel':''}" data-act="psel" data-id="${k}" aria-pressed="${sel===k}"><b>${n}</b><span>${t}</span></button>`).join('')}</div>
  ${lista||'<p class="empty">Tocá un cuadro para ver el detalle.</p>'}`;
}

function tk(p){
  const r=p.recepcion,pv=prov(p.prov);
  const items=p.items.map((i,k)=>{const ri=r?.items?.[k];const diff=ri&&num(ri.rec)!==num(i.cant);
    return `<li><span>${esc(i.nombre)}${ri&&ri.cal&&ri.cal!=='bien'?` <span class="lowtag">· calidad ${esc(ri.cal)}</span>`:''}${ri?.nota?`<br><small class="meta">${esc(ri.nota)}</small>`:''}</span><span class="q">${fmt(i.cant)} ${esc(i.unidad)}${ri?` → <span class="${diff?'lowtag':''}">${fmt(num(ri.rec))}</span>`:''}</span></li>`}).join('');
  let acts='';
  if(p.estado==='pendiente'||p.estado==='enviado')acts=`<div class="row"><a class="btn wa" href="${esc(waLink(p))}" target="_blank" rel="noopener" data-act="wa" data-id="${p.id}">${p.estado==='pendiente'?'Enviar':'Reenviar'} por WhatsApp</a><button class="dark" data-act="abrir" data-id="${p.id}">Recibir</button></div>`;else acts=`<div class="row"><button data-act="abrir" data-id="${p.id}">Ver detalle</button></div>`;
  return `<article class="tk"><span class="clip"></span><h3><span>${esc(pv?.nombre||'Proveedor')}</span>${badgeHTML(p)}</h3>
  <div class="meta">${esc(locName(p.local))} · pidió ${esc(nameOf(p.por))} · ${fecha(p.creado)} ${hora(p.creado)}</div>
  <ul>${items}</ul>${p.nota?`<p class="meta">Nota: ${esc(p.nota)}</p>`:''}
  ${r?`<p class="meta">Recibió ${esc(nameOf(r.por))} · ${fecha(r.t)} ${hora(r.t)}${num(r.monto)?` · remito ${money(num(r.monto))}`:''}${r.nota?`<br>${esc(r.nota)}`:''}</p>`:''}
  ${acts}</article>`;
}

const PAGOS=[['','Sin indicar'],['apagar','A pagar'],['pagado','Pagado'],['ctacte','Cuenta corriente']];
function recDraft(p){
  if(S.rec[p.id])return S.rec[p.id];
  const r=p.recepcion||{};
  return S.rec[p.id]={items:p.items.map((i,k)=>{const x=r.items?.[k]||{};return {rec:x.rec??i.cant,rem:x.rem??'',cal:x.cal||'bien',nota:x.nota||''}}),monto:r.monto||'',nota:r.nota||'',nro:r.nro||'',pago:r.pago||'',entrego:r.entrego||'',temp:r.temp||''};
}
function stLabel2(i,x){const d=num(x.rec)-num(i.cant),parts=[d===0?'Llegó justo':d<0?`Faltó ${fmt(-d)} ${i.unidad}`:`Sobró ${fmt(d)} ${i.unidad}`];if(String(x.rem).trim()!==''&&num(x.rem)!==num(x.rec))parts.push(`remito dice ${fmt(num(x.rem))}`);return parts.join(' · ')}
const stOk=(i,x)=>num(x.rec)===num(i.cant)&&(String(x.rem).trim()===''||num(x.rem)===num(x.rec));
function vRecView(p){
  const r=p.recepcion,pg=PAGOS.find(x=>x[0]===(r.pago||''))?.[1]||'Sin indicar';
  return `<div class="panel recform"><h3>Recepción cerrada</h3><p class="meta">Recibió ${esc(nameOf(r.por))} el ${fecha(r.t)} a las ${hora(r.t)}${r.editado?` · corregida por ${esc(nameOf(r.editadoPor))} el ${fecha(r.editado)}`:''}.</p>
  <div class="rechead"><span>Producto</span><span>Remito</span><span>Llegó</span></div>
  ${p.items.map((i,k)=>{const x=r.items?.[k]||{rec:0,cal:'bien'},xx={rec:x.rec,rem:x.rem??''};return `<div class="recrow2"><div><b>${esc(i.nombre)}</b><br><span class="meta">Pedido: ${fmt(num(i.cant))} ${esc(i.unidad)}</span><br><span class="st ${stOk(i,xx)?'ok':'bad'}">${stLabel2(i,xx)}</span></div>
  <span class="q" style="text-align:right">${x.rem!==undefined?fmt(x.rem):'–'}</span><span class="q" style="text-align:right">${fmt(x.rec)}</span>
  ${x.cal!=='bien'||x.nota?`<span class="meta" style="grid-column:1/-1">${x.cal!=='bien'?`<span class="lowtag">Calidad ${esc(x.cal)}</span> `:''}${esc(x.nota||'')}</span>`:''}</div>`}).join('')}
  <div class="list" style="margin-top:12px">${[['N° de remito',r.nro],['Total del remito',num(r.monto)?money(num(r.monto)):''],['Pago',pg],['Lo entregó',r.entrego],['Nota',r.nota]].filter(([,v])=>v).map(([k,v])=>`<div class="li"><span class="meta">${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
  <p class="note" style="margin-top:14px">La recepción ya está guardada y no se puede modificar. Si hay que corregir algo, pedíselo al administrador por <a href="${esc(sopLink())}" target="_blank" rel="noopener">Soporte</a>.</p></div>`;
}
function vRec(p){
  if(p.recepcion&&!S.owner)return vRecView(p);
  const d=recDraft(p),editando=!!p.recepcion;
  return `<form data-form="rec" data-id="${p.id}" id="rf-${p.id}" class="panel recform"><h3>${editando?'Datos de la recepción':'¿Cómo llegó?'}</h3>
  <p class="meta">Por cada producto: lo que dice el <b>remito</b> y lo que <b>llegó de verdad</b> (pesado o contado).</p>
  <div class="rechead"><span>Producto</span><span>Remito</span><span>Llegó</span></div>
  ${p.items.map((i,k)=>{const x=d.items[k];return `<div class="recrow2"><div><b>${esc(i.nombre)}</b><br><span class="meta">Pedido: ${fmt(num(i.cant))} ${esc(i.unidad)}</span><br><span class="st ${stOk(i,x)?'ok':'bad'}" id="st-${p.id}-${k}">${stLabel2(i,x)}</span></div>
  <input inputmode="decimal" aria-label="Según remito ${esc(i.nombre)}" data-rrem="${k}" value="${esc(x.rem)}" placeholder="–">
  <input inputmode="decimal" aria-label="Llegó ${esc(i.nombre)}" data-rec="${k}" value="${esc(x.rec)}">
  <select data-cal="${k}" aria-label="Calidad">${['bien','regular','mal'].map(c=>`<option ${x.cal===c?'selected':''} value="${c}">Calidad ${c}</option>`).join('')}</select>
  <input placeholder="Comentario (opcional)" data-rnota="${k}" value="${esc(x.nota)}"></div>`}).join('')}
  <div class="grid2" style="margin:14px 0">
  <div><label for="nr-${p.id}">N° de remito / factura</label><input id="nr-${p.id}" data-rf="nro" value="${esc(d.nro)}"></div>
  <div><label for="m-${p.id}">Total del remito ($)</label><input id="m-${p.id}" inputmode="decimal" data-rf="monto" value="${esc(d.monto)}"></div>
  <div><label for="pg-${p.id}">Pago</label><select id="pg-${p.id}" data-rf="pago">${PAGOS.map(([v,n])=>`<option value="${v}" ${d.pago===v?'selected':''}>${n}</option>`).join('')}</select></div>
  <div><label for="en-${p.id}">Quién lo entregó</label><input id="en-${p.id}" data-rf="entrego" value="${esc(d.entrego)}" placeholder="Nombre del repartidor"></div>
  <div><label for="n-${p.id}">Nota de la entrega</label><input id="n-${p.id}" data-rf="nota" value="${esc(d.nota)}" placeholder="Llegó tarde, faltó remito…"></div></div>
</form>`;
}function stLabel(ped,rec,u){const d=num(rec)-num(ped);return d===0?'Llegó justo':d<0?`Faltó ${fmt(-d)} ${u}`:`Sobró ${fmt(d)} ${u}`}

function vPedir(){
  const loc=workLocal(),d=S.pedir;
  const pvs=provsFor(loc);
  if(!pvs.length)return `<div class="head"><h2>Nuevo pedido para ${esc(locName(loc))}</h2></div><p class="empty">${esc(locName(loc))} todavía no tiene proveedores. Cargalos en Catálogo.</p>`;
  if(d.prov&&!pvs.some(p=>p.id===d.prov)){d.prov=null;d.qty={};d.unit={}}
  if(!d.prov)return `<div class="head"><div><h2>Nuevo pedido</h2><p class="sub">Elegí a qué proveedor le querés pedir.</p></div></div>
  <div class="provgrid">${pvs.map(p=>{const n=prods().filter(x=>x.prov===p.id).length,low=prods().filter(x=>x.prov===p.id&&minOf(x,loc)>0&&stockOf(loc,x.id)<minOf(x,loc)).length;return `<button class="provbtn" data-act="prov" data-id="${p.id}">${p.sector?`<small>${esc(p.sector)}</small>`:''}<b>${esc(p.nombre)}</b><span>${n} producto${n===1?'':'s'}${low?` · <span class="lowtag">${low} bajo el mínimo</span>`:''}</span></button>`}).join('')}</div>`;
  const list=prods().filter(p=>p.prov===d.prov),pvSel=prov(d.prov);

async function avisarChat(room,txt,men=[]){
  const av=S.cat?.avisos||{};if(!av.worker||!av.pushKey)return;
  try{
    const quien=uid=>uid!==S.uid&&(uid===S.ownerUid||(S.equipo[uid]?.activo&&(S.equipo[uid].local===room||S.equipo[uid].local==='todos')));

    sn.docs.forEach(d=>{if(quien(d.id))(men.includes(d.id)?subsMen:subs).push(...(d.data().subs||[]))});
    if(!S.owner)(men.includes(S.ownerUid)?subsMen:subs).push(...(av.subs||[]));
    const seen=new Set(),uniq=x=>x?.endpoint&&!seen.has(x.endpoint)&&seen.add(x.endpoint);subsMen=subsMen.filter(uniq);subs=subs.filter(uniq);
    const url=location.href.split('#')[0]+'#chat-'+room,base={key:av.pushKey,body:txt.slice(0,300),url};
    const mandar=(L,title)=>{for(let i=0;i<L.length;i+=10)fetch(av.worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...base,title,subs:L.slice(i,i+10)})}).catch(e=>console.warn('aviso chat',e))};

function difsBox(p){

    if(df<0)parts.push(`<b>faltó ${fmt(-df)} ${esc(i.unidad)}</b> (pidieron ${fmt(num(i.cant))}, llegó ${fmt(x.rec)})`);
    if(df>0)parts.push(`<b>sobró ${fmt(df)} ${esc(i.unidad)}</b> (pidieron ${fmt(num(i.cant))}, llegó ${fmt(x.rec)})`);
    if(x.rem!==undefined&&x.rem!==x.rec)parts.push(`el remito dice ${fmt(x.rem)} y llegó ${fmt(x.rec)}`);
    if(x.cal&&x.cal!=='bien')parts.push(`calidad ${esc(x.cal)}`);

async function comprimir(file){
  const img=await createImageBitmap(file);let w=img.width,h=img.height;const m=1100/Math.max(w,h);if(m<1){w=Math.round(w*m);h=Math.round(h*m)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.6,u=c.toDataURL('image/jpeg',q);while(u.length>220000&&q>.25){q-=.08;u=c.toDataURL('image/jpeg',q)}return u;
}

  const p=S.pedidos.find(x=>x.id===id),d=S.rec[id];if(!p||!d)return;
  const prev=p.recepcion,t=Date.now();
  if(prev&&!S.owner){S.note='Esta recepción ya está cerrada. Pedíselo al administrador.';render(true);return}
  const items=d.items.map(x=>({rec:num(x.rec),...(String(x.rem).trim()!==''?{rem:num(x.rem)}:{}),cal:x.cal,nota:String(x.nota).trim()}));
  const dif=items.some((x,k)=>x.rec!==num(p.items[k].cant)||x.cal!=='bien'||(x.rem!==undefined&&x.rem!==x.rec));
  const rec={t:prev?.t||t,por:prev?.por||S.uid,items,monto:num(d.monto),nota:String(d.nota).trim(),nro:String(d.nro).trim(),pago:d.pago||'',entrego:String(d.entrego).trim(),temp:String(d.temp).trim(),...(prev?{editado:t,editadoPor:S.uid}:{})};
  await w(()=>updateDoc(doc(db,'pedidos',id),{estado:dif?'diferencias':'recibido',recepcion:rec,hist:hist(p,prev?'editó la recepción':dif?'recibió con diferencias':'recibió todo OK')}));
  const add={};p.items.forEach((i,k)=>{if(!i.pid||(prod(i.pid)&&prod(i.pid).unidad!==i.unidad))return;const delta=items[k].rec-num(prev?.items?.[k]?.rec);if(delta)add[i.pid]=stockOf(p.local,i.pid)+delta});
  if(Object.keys(add).length)await w(()=>setDoc(doc(db,'stock',p.local),{items:add,t},{merge:true}));
  delete S.rec[id];render(true);
  if(!prev)push(`${dif?'⚠️ Llegó con diferencias':'✅ Pedido recibido'} · ${locName(p.local)}`,`${prov(p.prov)?.nombre||'Proveedor'}: recibió ${nameOf(S.uid)}${num(d.monto)?` · remito ${money(num(d.monto))}`:''}${dif?'\n'+p.items.map((i,k)=>{const x=items[k],df=x.rec-num(i.cant);return df!==0||x.cal!=='bien'?`• ${i.nombre}: ${df<0?'faltó '+fmt(-df)+' '+i.unidad:df>0?'sobró '+fmt(df)+' '+i.unidad:''}${x.cal!=='bien'?' calidad '+x.cal:''}`:''}).filter(Boolean).join('\n'):''}`,[dif?'warning':'white_check_mark']);
  toast(prev?'Cambios guardados.':dif?'Recepción guardada con diferencias.':'Recepción guardada. Stock actualizado.');
}async function guardarConteo(){
  const loc=workLocal(),ch={};for(const[k,v]of Object.entries(S.conteo))if(String(v).trim()!=='')ch[k]=num(v);
  if(!Object.keys(ch).length){S.note='No cargaste ningún conteo.';render(true);return}
  await w(()=>setDoc(doc(db,'stock',loc),{items:ch,t:Date.now(),conteoPor:S.uid},{merge:true}),'Conteo guardado');S.conteo={};render(true);
}
async function guardarCat(){
  const d=S.catDraft;d.proveedores=d.proveedores.filter(p=>p.nombre.trim());d.productos=d.productos.filter(p=>p.nombre.trim()&&d.proveedores.some(v=>v.id===p.prov));
  await w(()=>setDoc(doc(db,'cfg','catalogo'),{...S.cat,locales:locales(),proveedores:d.proveedores,productos:d.productos}),'Catálogo guardado');S.catDraft=null;render(true);
}

function menQuery(t){const m=t.value.slice(0,t.selectionStart).match(/(^|\s)@([^\s@]*)$/);return m?m[2]:null}
function menUpdate(t){
  const box=$('#mentions');if(!box)return;const q=menQuery(t);
  if(q===null){box.hidden=true;return}
  const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const L=chatGente(workLocal()).filter(p=>p.id!==S.uid&&norm(p.nombre).includes(norm(q)));
  if(!L.length){box.hidden=true;return}
  box.innerHTML=L.map((p,i)=>`<button type="button" class="${i?'':'on'}" data-act="mencionar" data-n="${esc(p.nombre)}">@${esc(p.nombre)}<small>${esc(p.rol||'')}</small></button>`).join('');box.hidden=false;

}

    const k=ds.rec??ds.rrem;if(ds.rec!==undefined)d.items[+ds.rec].rec=t.value;if(ds.rrem!==undefined)d.items[+ds.rrem].rem=t.value;

/* ---------- arranque ---------- */
async function claim(u){
  await setDoc(doc(db,'cfg','owner'),{uid:u.uid,t:Date.now()});
  await setDoc(doc(db,'equipo',u.uid),{nombre:S.claimName||'Dueño',email:u.email,rol:'Dueño',local:'todos',activo:true,alta:Date.now()});
  const c=await getDoc(doc(db,'cfg','catalogo'));if(!c.exists())await setDoc(doc(db,'cfg','catalogo'),SEED);
}
function subscribe(){
  let timer=setTimeout(()=>{S.note='Está tardando en cargar. Revisá la conexión.';render(true)},10000);
  const done=()=>{if(timer){clearTimeout(timer);timer=null;if(S.note.startsWith('Está tardando'))S.note=''}};
  const err=e=>{done();console.error(e);if(e.code==='permission-denied'){S.stage='blocked'}else{S.note='Se cortó la conexión con los datos. Recargá la página.'}render(true)};
  S.subs.push(onSnapshot(doc(db,'cfg','catalogo'),s=>{S.cat=s.exists()?s.data():{...SEED,proveedores:[],productos:[]};if(S.catDraft&&S.view!=='catalogo')S.catDraft=null;done();render()},err));
  S.subs.push(onSnapshot(query(collection(db,'pedidos'),orderBy('creado','desc'),limit(300)),s=>{S.pedidos=s.docs.map(d=>({id:d.id,...d.data()}));render()},err));
  S.subs.push(onSnapshot(collection(db,'stock'),s=>{S.stock={};s.docs.forEach(d=>S.stock[d.id]=d.data());render()},err));
  S.subs.push(onSnapshot(collection(db,'equipo'),s=>{S.equipo={};s.docs.forEach(d=>S.equipo[d.id]=d.data());
    const m=S.equipo[S.uid];if(!S.owner&&(!m||!m.activo)){S.stage='blocked'}render()},err));
}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
onAuthStateChanged(auth,async u=>{
  S.subs.forEach(f=>f());S.subs=[];Object.keys(chatSubs).forEach(k=>{chatSubs[k]();delete chatSubs[k]});S.chat={};S.cat=null;S.equipo={};S.pedidos=[];S.stock={};S.note='';
  S.uid=u?.uid||null;
  if(!u){S.stage='login';render(true);return}
  S.stage='loading';render(true);
  try{
    let o=await getDoc(doc(db,'cfg','owner'));
    if(!o.exists()){
      if(S.authMode!=='dueño'){S.stage='blocked';render(true);return}
      await claim(u);o=await getDoc(doc(db,'cfg','owner'));
    }
    S.owner=o.data().uid===u.uid;S.ownerUid=o.data().uid;
    if(!S.owner){const m=await getDoc(doc(db,'equipo',u.uid));if(!m.exists()||!m.data().activo){S.stage='blocked';render(true);return}}
    S.stage='app';if(!location.hash||location.hash==='#')history.replaceState(null,'','#inicio');subscribe();render(true);setTimeout(limpiarFotosViejas,8000);
  }catch(e){console.error(e);if(e.code==='permission-denied'){S.stage='blocked'}else{S.stage='error';S.note=errMsg(e)+(e.code?` (${e.code})`:'')}render(true)}
});
